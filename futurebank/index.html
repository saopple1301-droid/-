<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FutureBank</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--sub:#6b7385;--main:#2f6fed;--ok:#17a673;--warn:#e0892b;--line:#e3e7f0}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212b;--text:#e8ecf4;--sub:#9aa3b5;--line:#2c3340}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,#2f6fed,#6a4cf0);color:#fff;padding:20px 16px 56px}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
main{max-width:720px;margin:-40px auto 40px;padding:0 16px;display:grid;gap:16px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card h2{margin:0 0 12px;font-size:16px}
.balance{text-align:center}
.balance .yen{font-size:40px;font-weight:700;color:var(--main)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:var(--sub)}
form{display:grid;gap:8px;grid-template-columns:1fr 1fr}
form .full{grid-column:1/-1}
label{font-size:12px;color:var(--sub);display:grid;gap:4px}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:100%}
button{font:inherit;border:0;border-radius:8px;padding:10px;background:var(--main);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);padding:4px 8px}
.goal{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.goal-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--main)}
.bar.done i{background:var(--ok)}
.gap{font-size:13px;color:var(--sub);line-height:1.6}
.gap .behind{color:var(--warn);font-weight:600}
.gap .ahead{color:var(--ok);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li.log{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
li.log small{color:var(--sub)}
.empty{color:var(--sub);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--sub)}
.chart i{display:block;width:100%;background:var(--main);border-radius:4px 4px 0 0;min-height:2px}
</style>
</head>
<body>
<header>
  <h1>FutureBank</h1>
  <p>努力は、未来の自分への預金。</p>
</header>
<main>
  <section class="card balance">
    <div style="font-size:13px;color:var(--sub)">努力預金残高</div>
    <div class="yen" id="balance">¥0</div>
    <div class="stats">
      <div><b id="totalHours">0h</b><span>累計時間</span></div>
      <div><b id="streak">0日</b><span>連続記録</span></div>
      <div><b id="weekYen">¥0</b><span>今週の入金</span></div>
    </div>
  </section>

  <section class="card">
    <h2>努力を記録する（入金）</h2>
    <form id="logForm">
      <label>日付<input type="date" name="date" required></label>
      <label>科目・内容<input name="subject" list="subjects" placeholder="例: 英語" required></label>
      <label>時間（分）<input type="number" name="minutes" min="1" step="1" placeholder="60" required></label>
      <label>集中度<select name="focus">
        <option value="1">ふつう ×1.0</option>
        <option value="1.2">集中できた ×1.2</option>
        <option value="0.8">いまいち ×0.8</option>
      </select></label>
      <label class="full">メモ<input name="memo" placeholder="任意"></label>
      <button class="full">記録して入金</button>
    </form>
    <datalist id="subjects"></datalist>
  </section>

  <section class="card">
    <h2>目標とのギャップ</h2>
    <div id="goals"></div>
    <details style="margin-top:12px">
      <summary style="cursor:pointer;font-size:14px">目標を追加する</summary>
      <form id="goalForm" style="margin-top:8px">
        <label class="full">目標名<input name="name" placeholder="例: TOEIC 800点" required></label>
        <label>対象科目（空欄=すべて）<input name="subject" list="subjects"></label>
        <label>目標時間（時間）<input type="number" name="hours" min="1" step="0.5" required></label>
        <label>開始日<input type="date" name="start" required></label>
        <label>期限<input type="date" name="deadline" required></label>
        <button class="full">目標を追加</button>
      </form>
    </details>
  </section>

  <section class="card">
    <h2>直近7日の入金</h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card">
    <h2>入金履歴</h2>
    <ul id="logs"></ul>
  </section>

  <section class="card">
    <h2>設定</h2>
    <label>努力の時給（円 / 1時間）<input type="number" id="rate" min="0" step="50"></label>
    <p class="empty">「この1時間は将来いくらの価値になるか」を自分で決めましょう。例: 将来の時給目標や、塾1時間の料金など。</p>
  </section>
</main>

<script>
const KEY = 'futurebank-v1';
const today = () => new Date().toLocaleDateString('sv-SE');
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

let state = { rate: 1500, logs: [], goals: [] };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const value = l => l.minutes / 60 * state.rate * l.focus;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function streak() {
  const days = new Set(state.logs.map(l => l.date));
  let d = new Date(), n = 0;
  if (!days.has(today())) d.setDate(d.getDate() - 1); // 今日未記録でも昨日まで続いていれば継続扱い
  while (days.has(d.toLocaleDateString('sv-SE'))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function renderGoals() {
  const el = document.getElementById('goals');
  if (!state.goals.length) { el.innerHTML = '<p class="empty">目標を追加すると、今の自分とのギャップが見えます。</p>'; return; }
  el.innerHTML = state.goals.map((g, i) => {
    const done = state.logs
      .filter(l => (!g.subject || l.subject === g.subject) && l.date >= g.start && l.date <= g.deadline)
      .reduce((s, l) => s + l.minutes, 0) / 60;
    const total = Math.max(1, dayDiff(g.start, g.deadline) + 1);
    const elapsed = Math.min(total, Math.max(0, dayDiff(g.start, today()) + 1));
    const left = Math.max(0, dayDiff(today(), g.deadline) + 1);
    const ideal = g.hours * elapsed / total;           // 今日時点で終わっているべき時間
    const diff = done - ideal;
    const remain = Math.max(0, g.hours - done);
    const pct = Math.min(100, done / g.hours * 100);
    const perDay = left ? remain / left : remain;
    const status = done >= g.hours
      ? '<span class="ahead">達成！おめでとう</span>'
      : diff >= 0
        ? `<span class="ahead">ペースより ${diff.toFixed(1)}h 先行</span>`
        : `<span class="behind">ペースより ${(-diff).toFixed(1)}h 遅れ（${yen(-diff * state.rate)}分）</span>`;
    return `<div class="goal">
      <div class="goal-head"><b>${esc(g.name)}</b><button class="ghost" data-del-goal="${i}">削除</button></div>
      <div class="gap">${esc(g.subject || 'すべての科目')}・期限 ${g.deadline}</div>
      <div class="bar ${pct >= 100 ? 'done' : ''}"><i style="width:${pct}%"></i></div>
      <div class="gap">
        現在 <b>${done.toFixed(1)}h</b> / 目標 ${g.hours}h（${pct.toFixed(0)}%）<br>
        ${status}<br>
        ${done >= g.hours ? '' : left
          ? `残り ${remain.toFixed(1)}h・あと${left}日 → <b>1日 ${(perDay * 60).toFixed(0)}分</b>（毎日 ${yen(perDay * state.rate)} の入金）`
          : '<span class="behind">期限を過ぎています</span>'}
      </div></div>`;
  }).join('');
}

function render() {
  const total = state.logs.reduce((s, l) => s + value(l), 0);
  const mins = state.logs.reduce((s, l) => s + l.minutes, 0);
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6);
  const wk = weekAgo.toLocaleDateString('sv-SE');
  document.getElementById('balance').textContent = yen(total);
  document.getElementById('totalHours').textContent = (mins / 60).toFixed(1) + 'h';
  document.getElementById('streak').textContent = streak() + '日';
  document.getElementById('weekYen').textContent = yen(state.logs.filter(l => l.date >= wk).reduce((s, l) => s + value(l), 0));
  document.getElementById('rate').value = state.rate;
  document.getElementById('subjects').innerHTML = [...new Set(state.logs.map(l => l.subject))].map(s => `<option value="${esc(s)}">`).join('');

  const sorted = [...state.logs].map((l, i) => ({ ...l, i })).sort((a, b) => b.date.localeCompare(a.date) || b.i - a.i);
  document.getElementById('logs').innerHTML = sorted.length ? sorted.slice(0, 50).map(l => `
    <li class="log"><div>${esc(l.subject)} <small>${l.date}・${l.minutes}分${l.memo ? '・' + esc(l.memo) : ''}</small></div>
    <div><b>+${yen(value(l))}</b><button class="ghost" data-del-log="${l.i}">×</button></div></li>`).join('')
    : '<li class="empty">まだ記録がありません。最初の入金をしましょう！</li>';

  const days = [...Array(7)].map((_, k) => { const d = new Date(); d.setDate(d.getDate() - 6 + k); return d.toLocaleDateString('sv-SE'); });
  const vals = days.map(d => state.logs.filter(l => l.date === d).reduce((s, l) => s + value(l), 0));
  const max = Math.max(1, ...vals);
  document.getElementById('chart').innerHTML = days.map((d, k) =>
    `<div title="${yen(vals[k])}"><i style="height:${vals[k] / max * 85}%"></i>${d.slice(5)}</div>`).join('');

  renderGoals();
}

document.getElementById('logForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  state.logs.push({ date: f.get('date'), subject: f.get('subject').trim(), minutes: +f.get('minutes'), focus: +f.get('focus'), memo: f.get('memo').trim() });
  save(); e.target.minutes.value = ''; e.target.memo.value = ''; render();
});
document.getElementById('goalForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (f.get('deadline') < f.get('start')) { alert('期限は開始日より後にしてください'); return; }
  state.goals.push({ name: f.get('name').trim(), subject: f.get('subject').trim(), hours: +f.get('hours'), start: f.get('start'), deadline: f.get('deadline') });
  save(); e.target.reset(); e.target.start.value = today(); render();
});
document.getElementById('rate').addEventListener('change', e => { state.rate = Math.max(0, +e.target.value || 0); save(); render(); });
document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.delLog && confirm('この記録を削除しますか？')) { state.logs.splice(+t.dataset.delLog, 1); save(); render(); }
  if (t.dataset.delGoal && confirm('この目標を削除しますか？')) { state.goals.splice(+t.dataset.delGoal, 1); save(); render(); }
});

document.querySelector('#logForm [name=date]').value = today();
document.querySelector('#goalForm [name=start]').value = today();
render();
</script>
</body>
</html>
